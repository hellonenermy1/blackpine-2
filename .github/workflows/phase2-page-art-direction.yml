name: Phase 2 page art direction

on:
  push:
    branches: [phase-2-page-art-direction]
    paths:
      - '.github/workflows/phase2-page-art-direction.yml'

permissions:
  contents: write

jobs:
  build-phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply Phase 2 page-specific art direction
        shell: bash
        run: |
          set -euo pipefail
          cp media-library/blackpine-shortlist/engineering/02-software-engineer-dim-office.jpg public/assets/editorial/careers-engineering-landscape.jpg
          cp media-library/blackpine-shortlist/canada/04-toronto-twilight-skyline.jpg public/assets/editorial/contact-canada-landscape.jpg

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:140]}')
              p.write_text(text.replace(old, new, 1))

          def jpeg_size(path):
              data = Path(path).read_bytes()
              i = 2
              while i + 9 < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  marker = data[i+1]
                  i += 2
                  if marker in (0xD8, 0xD9):
                      continue
                  if i + 2 > len(data):
                      break
                  length = int.from_bytes(data[i:i+2], 'big')
                  if marker in {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}:
                      h = int.from_bytes(data[i+3:i+5], 'big')
                      w = int.from_bytes(data[i+5:i+7], 'big')
                      return w, h
                  i += length
              raise SystemExit(f'cannot read JPEG size: {path}')

          cw, ch = jpeg_size('public/assets/editorial/careers-engineering-landscape.jpg')
          tw, th = jpeg_size('public/assets/editorial/contact-canada-landscape.jpg')

          careers_marker = '  }) + `<section class="section"><div class="shell"><div class="section-head"><div class="section-label">Planned hiring</div>'
          careers_split = f'''  }}) + `<section class="section editorial-split-section careers-editorial" aria-label="Careers working context"><div class="shell editorial-split"><figure class="editorial-split-media"><img src="/assets/editorial/careers-engineering-landscape.jpg" alt="" width="{cw}" height="{ch}" loading="lazy" decoding="async" fetchpriority="low"><figcaption>Engineering work / editorial context — not a staff photograph</figcaption></figure><div class="editorial-split-copy"><span class="eyebrow">Working style</span><h2>Careful work, explained clearly.</h2><p>Blackpine's hiring language emphasizes evidence, reasoning, ownership, and systems that remain understandable after the work is complete. The image is editorial context rather than a representation of Blackpine staff.</p></div></div></section><section class="section"><div class="shell"><div class="section-head"><div class="section-label">Planned hiring</div>'''
          replace_once('src/pages/company.mjs', careers_marker, careers_split)

          contact_marker = '  }) + `<section class="section"><div class="shell content-grid"><aside class="on-page"><span>Contact</span>'
          contact_split = f'''  }}) + `<section class="section editorial-split-section contact-editorial" aria-label="Canadian operating context"><div class="shell editorial-split editorial-split-reverse"><div class="editorial-split-copy"><span class="eyebrow">Canada-based practice</span><h2>Start with the situation, not the service name.</h2><p>The public contact route is intentionally simple: describe what changed, what is affected, and what outcome you need. The Toronto image provides geographic context only; it does not represent a Blackpine office location.</p></div><figure class="editorial-split-media"><img src="/assets/editorial/contact-canada-landscape.jpg" alt="" width="{tw}" height="{th}" loading="lazy" decoding="async" fetchpriority="low"><figcaption>Toronto / geographic context — not a Blackpine office</figcaption></figure></div></section><section class="section"><div class="shell content-grid"><aside class="on-page"><span>Contact</span>'''
          replace_once('src/pages/contact-legal.mjs', contact_marker, contact_split)

          css = Path('src/styles/pages.css')
          text = css.read_text()
          marker = '/* Phase 2 page-specific art direction */'
          if marker not in text:
              text += '''\n\n/* Phase 2 page-specific art direction */\n.editorial-split-section { padding-top: 34px; padding-bottom: 58px; }\n.editorial-split { display: grid; grid-template-columns: minmax(0, 1.32fr) minmax(300px, .78fr); gap: clamp(28px, 4.8vw, 72px); align-items: center; }\n.editorial-split-reverse { grid-template-columns: minmax(300px, .78fr) minmax(0, 1.32fr); }\n.editorial-split-media { margin: 0; border: 1px solid var(--line); background: var(--bg-2); overflow: hidden; }\n.editorial-split-media img { width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; display: block; filter: saturate(.68) contrast(1.035); }\n.careers-editorial .editorial-split-media img { object-position: 50% 47%; }\n.contact-editorial .editorial-split-media img { object-position: 50% 52%; }\n.editorial-split-media figcaption { padding: 10px 12px 11px; border-top: 1px solid var(--line); color: var(--faint); font-family: var(--font-mono); font-size: 9px; line-height: 1.35; letter-spacing: .08em; text-transform: uppercase; }\n.editorial-split-copy { max-width: 560px; }\n.editorial-split-copy h2 { margin: 12px 0 0; font-size: clamp(32px, 4vw, 52px); line-height: 1.08; letter-spacing: -.035em; }\n.editorial-split-copy p { margin: 20px 0 0; color: var(--muted); font-size: 16px; line-height: 1.65; }\n@media (max-width: 820px) {\n  .editorial-split-section { padding-top: 18px; padding-bottom: 46px; }\n  .editorial-split, .editorial-split-reverse { grid-template-columns: 1fr; gap: 24px; }\n  .editorial-split-reverse .editorial-split-copy { order: 2; }\n  .editorial-split-reverse .editorial-split-media { order: 1; }\n  .editorial-split-media img { aspect-ratio: 4 / 3; }\n}\n'''
              css.write_text(text)

          checks = Path('scripts/check.mjs')
          text = checks.read_text()
          check_marker = "if (!/src=\"\\/assets\\/editorial\\/labs-hardware-macro\\.jpg\"[^>]*width=\"1600\"[^>]*height=\"900\"/.test(homeHtml)) {\n  errors.push('homepage Labs editorial image must declare its 1600x900 intrinsic dimensions');\n}\n"
          check_add = check_marker + f'''\nconst careersHtml = await fs.readFile(new URL('./company/careers/index.html', dist), 'utf8');\nif (!careersHtml.includes('/assets/editorial/careers-engineering-landscape.jpg')) errors.push('careers page is missing its Phase 2 editorial image');\nif (!careersHtml.includes('not a staff photograph')) errors.push('careers editorial image must retain its non-staff context caption');\nconst contactHtml = await fs.readFile(new URL('./contact/index.html', dist), 'utf8');\nif (!contactHtml.includes('/assets/editorial/contact-canada-landscape.jpg')) errors.push('contact page is missing its Phase 2 Canadian-context image');\nif (!contactHtml.includes('not a Blackpine office')) errors.push('contact editorial image must retain its office-location disclaimer');\nconst trustHtml = await fs.readFile(new URL('./trust/index.html', dist), 'utf8');\nif (trustHtml.includes('/assets/editorial/')) errors.push('Trust index should remain documentation-first without editorial photography');\n'''
          replace_once('scripts/check.mjs', check_marker, check_add)

          doc = Path('docs/IMAGE_PHASE2_SYSTEM.md')
          doc.write_text('''# Image Phase 2 — page-specific art direction\n\nStatus: implemented on `phase-2-page-art-direction`.\n\n## Reusable treatments\n\n1. **Graphic hero** — Home keeps the Blackpine system-map hero; photography does not replace brand identity.\n2. **Wide structural beat** — Home and Capabilities use one wide image to change page rhythm between information systems.\n3. **Asymmetric duo** — Company uses architecture plus Canadian context with explicit captions.\n4. **Square editorial cards** — Research uses 1:1 technical imagery for selected publications.\n5. **Full-width project band** — Labs uses a hardware macro behind project-specific copy.\n6. **Editorial split** — Careers and Contact use a single image paired with page-specific context, not a repeated generic template.\n\n## Intentional exceptions\n\n- Trust remains documentation-first and does not receive decorative photography.\n- Individual service-detail pages remain primarily technical and text-led.\n- Cipher detail pages do not use generic hardware imagery that could imply implementation facts not established by the project documentation.\n\n## Representation rules\n\n- Human editorial photography must not imply the subjects are Blackpine staff.\n- Canadian city imagery must not imply a pictured building or location is a Blackpine office.\n- Decorative/contextual images use empty alt text; nearby visible copy carries the actual meaning.\n- Photography stays sparse enough that each image has a clear structural role.\n''')
          PY

      - name: Verify production build
        run: npm run verify

      - name: Commit Phase 2 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'blackpine-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/editorial/careers-engineering-landscape.jpg public/assets/editorial/contact-canada-landscape.jpg src/pages/company.mjs src/pages/contact-legal.mjs src/styles/pages.css scripts/check.mjs docs/IMAGE_PHASE2_SYSTEM.md
          git commit -m 'design: establish page-specific editorial treatments' || exit 0
          git push origin HEAD:phase-2-page-art-direction
