name: Verify Blackpine V2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static site
        run: npm run build
      - name: Run structural audit
        run: npm run check
      - name: Verify no runtime dependency install is required
        run: |
          test ! -d node_modules
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/.well-known/security.txt
