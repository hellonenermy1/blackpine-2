name: Verify Blackpine

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build static site
        run: npm run build
      - name: Report Phase 2 localization gaps
        run: node scripts/report-i18n-phase2-gaps.mjs
      - name: Report Phase 3 localization gaps
        run: node scripts/report-i18n-phase3-gaps.mjs
      - name: Run structural and production audits
        run: npm run check
      - name: Upload Phase 4 translation baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase4-translation-baseline
          path: phase4-artifacts/translation-status.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify no runtime dependency install is required
        run: |
          test ! -d node_modules
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/.well-known/security.txt

  browser-audit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQUIRE_FIREFOX: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build static site
        run: npm run build
      - name: Run rendered browser audit
        run: |
          npm run check:browser
          node scripts/export-localization-inventory.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blackpine-browser-audit
          path: browser-artifacts/
          if-no-files-found: warn
          retention-days: 14

  external-links:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build static site
        run: npm run build
      - name: Check external site destinations
        run: npm run check:external
