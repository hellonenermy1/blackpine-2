name: Apply Blackpine editorial image placement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-editorial-placement.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply researched editorial placements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:90]}')
              p.write_text(text.replace(old, new, 1))

          home_marker = '  <section class="section"><div class="shell"><div class="section-head"><div class="section-label">What is happening?</div>'
          home_media = '''  <section class="media-section home-editorial-break" aria-label="Blackpine visual study"><div class="shell"><div class="editorial-wide"><img src="/assets/editorial/company-architecture-landscape.jpg" alt="Modern glass and concrete architecture photographed as a study in structure and engineered systems" width="1600" height="900" loading="lazy" decoding="async"></div></div></section>\n'''
          replace_once('src/pages/home.mjs', home_marker, home_media + home_marker)

          replace_once(
              'src/pages/home.mjs',
              '<section class="photo-band"><img src="${site.infrastructureImage}" alt="Blackpine control-path diagram representing connected infrastructure and administrative trust" width="1600" height="900" loading="lazy" decoding="async">',
              '<section class="photo-band"><img src="/assets/editorial/labs-hardware-macro.jpg" alt="Macro photograph of physical circuit-board components and traces" width="1600" height="900" loading="lazy" decoding="async">'
          )

          services_marker = '  <section class="section"><div class="shell"><div class="section-head"><div class="section-label">Specialist services</div>'
          services_media = '''  <section class="media-section services-editorial-break" aria-label="Infrastructure detail"><div class="shell"><div class="editorial-wide editorial-wide-shallow"><img src="/assets/editorial/services-infrastructure-landscape.jpg" alt="Rows of physical server infrastructure in a data-centre environment" width="1600" height="900" loading="lazy" decoding="async"></div></div></section>\n'''
          replace_once('src/pages/services.mjs', services_marker, services_media + services_marker)

          company_marker = '  }) + `<section class="section"><div class="shell content-grid"><aside class="on-page"><span>Company</span>'
          company_media = '''  }) + `<section class="section company-media-intro" aria-label="Company visual studies"><div class="shell"><div class="editorial-duo"><figure class="editorial-image editorial-image-landscape"><img src="/assets/editorial/company-architecture-portrait.jpg" alt="Dark modern urban architecture with strong vertical geometry" width="1200" height="1600" loading="eager" decoding="async"></figure><figure class="editorial-image editorial-image-portrait"><img src="/assets/editorial/company-canada-portrait.jpg" alt="Snowy Toronto street at night, used as Canadian urban context rather than as an office photograph" width="1200" height="1600" loading="lazy" decoding="async"></figure></div></div></section><section class="section"><div class="shell content-grid"><aside class="on-page"><span>Company</span>'''
          replace_once('src/pages/company.mjs', company_marker, company_media)

          replace_once(
              'src/pages/research.mjs',
              '];\n\nfunction selectedResearch()',
              "];\n\nconst featuredImages = [\n  '/assets/editorial/research-patch-panel-square.jpg',\n  '/assets/editorial/research-fiber-square.jpg',\n  '/assets/editorial/research-workstation-square.jpg'\n];\n\nfunction selectedResearch()"
          )
          replace_once(
              'src/pages/research.mjs',
              '<span class="research-feature-index">0${index + 1}</span><span class="research-meta">',
              '<span class="research-feature-index">0${index + 1}</span><span class="research-feature-media"><img src="${featuredImages[index] || featuredImages[0]}" alt="" width="900" height="900" loading="lazy" decoding="async"></span><span class="research-meta">'
          )

          replace_once(
              'src/pages/labs-trust.mjs',
              '<section class="photo-band"><img src="${site.infrastructureImage}" alt="Abstract Blackpine infrastructure and control-path diagram" width="1600" height="900" loading="eager" decoding="async">',
              '<section class="photo-band"><img src="/assets/editorial/labs-hardware-macro.jpg" alt="Macro photograph of circuit-board components and physical traces" width="1600" height="900" loading="eager" decoding="async">'
          )

          css = Path('src/styles/pages.css')
          text = css.read_text()
          marker = '/* Editorial imagery system — 100-site placement study */'
          if marker not in text:
              text += '''\n\n/* Editorial imagery system — 100-site placement study */\n.media-section { padding: 24px 0 86px; }\n.editorial-wide, .editorial-image, .research-feature-media { overflow: hidden; background: var(--bg-2); }\n.editorial-wide { width: 100%; aspect-ratio: 2.05 / 1; border: 1px solid var(--line); }\n.editorial-wide-shallow { aspect-ratio: 2.35 / 1; }\n.editorial-wide img, .editorial-image img, .research-feature-media img { width: 100%; height: 100%; object-fit: cover; display: block; }\n.editorial-wide img { filter: saturate(.72) contrast(1.03); }\n.home-editorial-break { padding-top: 0; }\n.services-editorial-break { padding-top: 0; padding-bottom: 34px; }\n.company-media-intro { padding-top: 34px; padding-bottom: 26px; }\n.editorial-duo { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(230px, .65fr); gap: 20px; align-items: end; }\n.editorial-image { margin: 0; border: 1px solid var(--line); }\n.editorial-image-landscape { aspect-ratio: 1.55 / 1; }\n.editorial-image-portrait { aspect-ratio: 3 / 4; max-height: 610px; }\n.editorial-image img { filter: saturate(.68) contrast(1.04); }\n.research-feature { min-height: 0; }\n.research-feature-media { display: block; margin-top: 20px; aspect-ratio: 1 / 1; border: 1px solid var(--line); }\n.research-feature-media img { filter: saturate(.78) contrast(1.04); transition: transform 420ms cubic-bezier(.2,.7,.2,1), filter 240ms ease; }\n.research-feature:hover .research-feature-media img { transform: scale(1.018); filter: saturate(.86) contrast(1.05); }\n.research-feature .research-meta { margin-top: 22px; padding-top: 0; }\n@media (max-width: 980px) {\n  .media-section { padding: 12px 0 58px; }\n  .editorial-wide, .editorial-wide-shallow { aspect-ratio: 4 / 3; }\n  .editorial-duo { grid-template-columns: minmax(0, 1.2fr) minmax(160px, .8fr); gap: 12px; }\n  .editorial-image-landscape { aspect-ratio: 4 / 3; }\n  .editorial-image-portrait { max-height: 520px; }\n}\n@media (max-width: 640px) {\n  .company-media-intro { padding-top: 18px; }\n  .editorial-duo { grid-template-columns: 1fr; }\n  .editorial-image-landscape { aspect-ratio: 4 / 3; }\n  .editorial-image-portrait { width: 68%; justify-self: end; aspect-ratio: 3 / 4; }\n  .research-feature-media { aspect-ratio: 4 / 3; }\n}\n'''
              css.write_text(text)
          PY

      - name: Verify production build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify

      - name: Commit placement changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'blackpine-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/home.mjs src/pages/services.mjs src/pages/company.mjs src/pages/research.mjs src/pages/labs-trust.mjs src/styles/pages.css
          git commit -m 'design: place curated editorial imagery across Blackpine' || exit 0
          git push origin HEAD:main

# retrigger after editorial assets landed on main
