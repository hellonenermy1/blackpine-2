name: Blackpine expansion foundation

on:
  pull_request:
    paths:
      - 'expansion/phase1/**'
      - '.github/workflows/blackpine-expansion-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate service catalogue
        run: node expansion/phase1/tests/check-catalogue.mjs
      - name: Validate D1 schema constraints offline
        run: python3 expansion/phase1/tests/check-sqlite.py
      - name: Verify portal authentication and tenant API boundaries
        run: node expansion/phase1/tests/check-portal.mjs
      - name: Validate catalogue SQL seeding and local snapshot restoration
        run: python3 expansion/phase1/tests/check-seed.py
      - name: Validate HTML report sanitization
        run: node expansion/phase1/tests/check-reports.mjs
      - name: Reject audit-log updates and deletion
        run: python3 expansion/phase1/tests/check-audit-integrity.py
