name: Promote Blackpine editorial images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-editorial-images.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy curated images into public assets
        shell: bash
        run: |
          set -euo pipefail
          src='media-library/blackpine-shortlist'
          dst='public/assets/editorial'
          mkdir -p "$dst"
          cp "$src/architecture/01-glass-concrete-office.jpg" "$dst/company-architecture-landscape.jpg"
          cp "$src/architecture/04-dark-urban-architecture.jpg" "$dst/company-architecture-portrait.jpg"
          cp "$src/architecture/09-concrete-glass-building.jpg" "$dst/trust-architecture-square.jpg"
          cp "$src/infrastructure/01-server-racks-red.jpg" "$dst/home-infrastructure-landscape.jpg"
          cp "$src/infrastructure/06-server-rack-row.jpg" "$dst/services-infrastructure-landscape.jpg"
          cp "$src/infrastructure/03-patch-panel-organized.jpg" "$dst/research-patch-panel-square.jpg"
          cp "$src/infrastructure/04-fiber-server-ports.jpg" "$dst/research-fiber-square.jpg"
          cp "$src/engineering/06-engineer-workstation-overhead.jpg" "$dst/research-workstation-square.jpg"
          cp "$src/hardware/01-circuit-board-macro.jpg" "$dst/labs-hardware-macro.jpg"
          cp "$src/canada/06-toronto-snowy-night.jpg" "$dst/company-canada-portrait.jpg"
          test "$(find "$dst" -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')" = '10'
      - name: Commit promoted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'blackpine-media-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/editorial
          git commit -m 'assets: promote editorial image set for website' || exit 0
          git push origin HEAD:main
