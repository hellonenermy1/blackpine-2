name: Phase 3 production polish

on:
  push:
    branches: [phase-3-production-polish]
    paths:
      - '.github/workflows/phase3-production-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install image tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick jpegoptim
      - name: Build responsive editorial images
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            home-infrastructure-landscape
            services-infrastructure-landscape
            labs-hardware-macro
            company-architecture-portrait
            company-canada-portrait
            research-patch-panel-square
            research-fiber-square
            research-workstation-square
            careers-engineering-landscape
            contact-canada-landscape
          )
          for name in "${assets[@]}"; do
            src="public/assets/editorial/${name}.jpg"
            for w in 640 960 1280; do
              convert "$src" -auto-orient -resize "${w}x>" -strip -interlace Plane -quality 79 "public/assets/editorial/${name}-${w}.jpg"
            done
            jpegoptim --strip-all --all-progressive --max=84 "$src" >/dev/null
          done
      - name: Add responsive delivery and production guardrails
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          specs = {
            'home-infrastructure-landscape': '(max-width: 820px) 100vw, min(1180px, 92vw)',
            'services-infrastructure-landscape': '(max-width: 820px) 100vw, min(1180px, 92vw)',
            'labs-hardware-macro': '100vw',
            'company-architecture-portrait': '(max-width: 820px) 100vw, 55vw',
            'company-canada-portrait': '(max-width: 820px) 100vw, 40vw',
            'careers-engineering-landscape': '(max-width: 820px) 100vw, 58vw',
            'contact-canada-landscape': '(max-width: 820px) 100vw, 58vw',
          }

          for path in Path('src/pages').glob('*.mjs'):
            text = path.read_text()
            for name, sizes in specs.items():
              needle = f'src="/assets/editorial/{name}.jpg"'
              if needle in text and f'{name}-640.jpg' not in text:
                repl = (needle +
                  f' srcset="/assets/editorial/{name}-640.jpg 640w, /assets/editorial/{name}-960.jpg 960w, /assets/editorial/{name}-1280.jpg 1280w, /assets/editorial/{name}.jpg 1600w"'
                  f' sizes="{sizes}"')
                text = text.replace(needle, repl)
            path.write_text(text)

          research = Path('src/pages/research.mjs')
          text = research.read_text()
          old = '<img src="${featuredImages[index] || featuredImages[0]}" alt="" width="900" height="900" loading="lazy" decoding="async" fetchpriority="low">'
          new = '<img src="${featuredImages[index] || featuredImages[0]}" srcset="${(featuredImages[index] || featuredImages[0]).replace(\'.jpg\', \'-640.jpg\')} 640w, ${(featuredImages[index] || featuredImages[0]).replace(\'.jpg\', \'-960.jpg\')} 960w, ${(featuredImages[index] || featuredImages[0]).replace(\'.jpg\', \'-1280.jpg\')} 1280w, ${featuredImages[index] || featuredImages[0]} 1600w" sizes="(max-width: 820px) 100vw, 33vw" alt="" width="900" height="900" loading="lazy" decoding="async" fetchpriority="low">'
          if old in text and 'research-patch-panel-square-640.jpg' not in text:
            text = text.replace(old, new, 1)
          research.write_text(text)

          check = Path('scripts/check.mjs')
          text = check.read_text()
          marker = "const pngSignature = Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]);"
          if 'Phase 3 responsive editorial image guardrails' not in text:
            block = '''// Phase 3 responsive editorial image guardrails\nconst responsiveEditorial = [\n  'home-infrastructure-landscape',\n  'services-infrastructure-landscape',\n  'labs-hardware-macro',\n  'company-architecture-portrait',\n  'company-canada-portrait',\n  'research-patch-panel-square',\n  'research-fiber-square',\n  'research-workstation-square',\n  'careers-engineering-landscape',\n  'contact-canada-landscape'\n];\nfor (const name of responsiveEditorial) {\n  for (const width of [640, 960, 1280]) {\n    try { await fs.access(new URL(`./assets/editorial/${name}-${width}.jpg`, dist)); }\n    catch { errors.push(`missing responsive editorial asset: ${name}-${width}.jpg`); }\n  }\n}\nfor (const rel of ['./index.html','./services/index.html','./company/about/index.html','./company/careers/index.html','./contact/index.html','./research/index.html','./labs/index.html']) {\n  const html = await fs.readFile(new URL(rel, dist), 'utf8');\n  if (html.includes('/assets/editorial/') && !html.includes('srcset=')) errors.push(`${rel} uses editorial imagery without responsive srcset`);\n}\n\n'''
            text = text.replace(marker, block + marker)
            check.write_text(text)

          Path('docs/IMAGE_PHASE3_PRODUCTION.md').write_text('''# Image Phase 3 — production polish\n\nStatus: implemented on `phase-3-production-polish`.\n\n## Delivery\n\n- Production editorial JPEGs are stripped of unnecessary metadata and recompressed conservatively.\n- Every actively used editorial image has 640px, 960px, and 1280px responsive variants.\n- Page markup uses `srcset` and page-specific `sizes` so mobile and card layouts do not download desktop-sized imagery.\n- Existing intrinsic width/height attributes remain in place to protect layout stability.\n- Below-the-fold editorial imagery remains lazy-loaded and low fetch priority.\n\n## Visual QA rules\n\n- Preserve page-specific crop/focal-point rules established in Phases 1–2.\n- Do not make Trust or service-detail pages image-heavy simply for visual consistency.\n- Human and location photography remains contextual and must not imply staff, clients, or office ownership.\n- Prefer removing an image over using one without a clear structural role.\n\n## Production guardrails\n\nThe build now verifies responsive variants exist for every active editorial image and checks image-bearing page families for `srcset` delivery. Browser audits remain the final responsive-layout gate.\n''')
          PY
      - name: Verify full production build
        run: npm run verify
      - name: Commit Phase 3 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'blackpine-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/editorial src/pages scripts/check.mjs docs/IMAGE_PHASE3_PRODUCTION.md
          git commit -m 'perf: optimize responsive editorial image delivery' || exit 0
          git push origin HEAD:phase-3-production-polish
