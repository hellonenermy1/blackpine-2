name: Update copy guardrails

on:
  push:
    branches: [copy-humanization-pass]
    paths:
      - '.github/workflows/copy-humanization-checker-fix.yml'

permissions:
  contents: write

jobs:
  update-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Update release checks without weakening factual safeguards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/check-v4-phase4.mjs')
          text = p.read_text()
          text = text.replace("  'Service commitments belong in the written agreement.',\n  'Response windows, coverage hours, supported products, monitoring responsibilities, escalation, access, data handling, and unused retainer capacity are not implied by the website.'\n", "  'Service commitments are agreed in writing.',\n  'Each engagement defines response windows, coverage hours, supported products, monitoring responsibilities, escalation, access, data handling, and retainer terms where applicable.'\n")
          text = text.replace("if (!about.includes('This is a brand interpretation, not a claim about the historical origin of the company name.')) errors.push('About page must keep the brand-name historical boundary explicit');", "if (!about.includes('The black pine reflects how Blackpine approaches security work')) errors.push('About page must keep the brand meaning framed as a current Blackpine design principle');")
          text = text.replace("if (!audiences.includes('not a public client list or a claim of sector-specific client history')) errors.push('Who-we-work-with page must distinguish supportable environments from unverified client-sector history');", "if (!audiences.includes('show the kinds of environments where our work is most relevant')) errors.push('Who-we-work-with page must describe supportable environments without presenting a client-sector history claim');")
          p.write_text(text)

          # Touch the main humanization workflow so it reruns against the updated guardrails.
          wf = Path('.github/workflows/copy-humanization.yml')
          w = wf.read_text()
          marker = '# guardrails-updated\n'
          if marker not in w:
              w += '\n' + marker
              wf.write_text(w)
          PY
      - name: Commit guardrail update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'blackpine-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/check-v4-phase4.mjs .github/workflows/copy-humanization.yml
          git commit -m 'test: preserve factual safeguards with natural public copy'
          git push origin HEAD:copy-humanization-pass
