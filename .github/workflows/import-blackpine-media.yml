name: Import Blackpine media shortlist

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-blackpine-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download curated Pexels shortlist
        shell: bash
        run: |
          set -euo pipefail
          root='media-library/blackpine-shortlist'
          mkdir -p "$root"/{infrastructure,engineering,architecture,canada,hardware}

          download() {
            category="$1"
            name="$2"
            id="$3"
            out="$root/$category/$name.jpg"
            url="https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=1600&quality=85"
            echo "Downloading $category/$name ($id)"
            curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$url" -o "$out"
            test -s "$out"
          }

          download infrastructure 01-server-racks-red 5480781
          download infrastructure 02-secure-server-enclosure 6466141
          download infrastructure 03-patch-panel-organized 5073493
          download infrastructure 04-fiber-server-ports 1624895
          download infrastructure 05-engineer-core-switch 19226353
          download infrastructure 06-server-rack-row 5408005
          download infrastructure 07-green-network-cables 1597776
          download infrastructure 08-blue-patch-cables 4682187
          download infrastructure 09-network-rack-closeup 2881229
          download infrastructure 10-server-wiring-detail 5242294

          download engineering 01-it-professional-dim-office 32755772
          download engineering 02-software-engineer-dim-office 5483158
          download engineering 03-dual-monitor-programming 5473299
          download engineering 04-developer-dual-screens 5473301
          download engineering 05-engineer-dual-monitors 3861958
          download engineering 06-engineer-workstation-overhead 3861972
          download engineering 07-code-screen-dark 6424589
          download engineering 08-developer-modern-office 9301508
          download engineering 09-programmers-working-together 6803554
          download engineering 10-developer-dual-monitor-office 16323580

          download architecture 01-glass-concrete-office 5233311
          download architecture 02-modern-glass-concrete-facade 35493219
          download architecture 03-sleek-office-exterior 38952645
          download architecture 04-dark-urban-architecture 15011056
          download architecture 05-tall-office-facade 34165409
          download architecture 06-office-building-at-night 13464876
          download architecture 07-contemporary-glass-skyscraper 7078008
          download architecture 08-angular-modern-office 17097090
          download architecture 09-concrete-glass-building 9589001
          download architecture 10-office-facade-closeup 31175552

          download canada 01-toronto-night-skyline 6136496
          download canada 02-downtown-toronto-night 6946242
          download canada 03-toronto-city-lights 6807185
          download canada 04-toronto-twilight-skyline 1248513
          download canada 05-toronto-aerial-night 11410626
          download canada 06-toronto-snowy-night 11422298
          download canada 07-downtown-toronto-traffic 29207539
          download canada 08-gooderham-winter-night 6946244
          download canada 09-toronto-street-night 18325954
          download canada 10-toronto-financial-district-night 13447645

          download hardware 01-circuit-board-macro 40342987
          download hardware 02-red-circuit-board 6432109
          download hardware 03-resistors-board-macro 32324512
          download hardware 04-electronic-board-traces 34924858
          download hardware 05-board-components-macro 36169775
          download hardware 06-microchip-components 6755086
          download hardware 07-electronic-chip-board 6754853
          download hardware 08-computer-board-components 36169769
          download hardware 09-gold-hardware-contacts 6704970
          download hardware 10-electronic-board-detail 6755140

          count=$(find "$root" -type f -name '*.jpg' | wc -l | tr -d ' ')
          test "$count" = '50'

          cat > "$root/README.md" <<'EOF'
          # Blackpine image shortlist

          Curated visual library for future Blackpine Cybersecurity website art direction.

          **Status:** library only. These files are intentionally stored outside `public/` and are not referenced by the website, CSS, JavaScript, or build output.

          ## Composition

          - 10 infrastructure / data-centre images
          - 10 engineering / real-work images
          - 10 architecture images
          - 10 Toronto / Canada images
          - 10 hardware / macro images
          - 50 images total

          ## Source and licence

          All 50 files were downloaded from photo pages marked **Free to use** on Pexels at the time of curation. Source photo IDs are preserved in `SOURCES.tsv` for traceability. Review the current Pexels licence before production publication and check any photograph for visible trademarks, identifiable people, private property, or other third-party rights relevant to the proposed use.

          No image in this folder is currently approved for a specific page placement or endorsement claim.
          EOF

          cat > "$root/SOURCES.tsv" <<'EOF'
          category	file	pexels_photo_id	source_page
          infrastructure	01-server-racks-red.jpg	5480781	https://www.pexels.com/photo/5480781/
          infrastructure	02-secure-server-enclosure.jpg	6466141	https://www.pexels.com/photo/6466141/
          infrastructure	03-patch-panel-organized.jpg	5073493	https://www.pexels.com/photo/5073493/
          infrastructure	04-fiber-server-ports.jpg	1624895	https://www.pexels.com/photo/1624895/
