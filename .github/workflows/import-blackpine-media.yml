          canada	10-toronto-financial-district-night.jpg	13447645	https://www.pexels.com/photo/13447645/
          hardware	01-circuit-board-macro.jpg	40342987	https://www.pexels.com/photo/40342987/
          hardware	02-red-circuit-board.jpg	6432109	https://www.pexels.com/photo/6432109/
          hardware	03-resistors-board-macro.jpg	32324512	https://www.pexels.com/photo/32324512/
          hardware	04-electronic-board-traces.jpg	34924858	https://www.pexels.com/photo/34924858/
          hardware	05-board-components-macro.jpg	36169775	https://www.pexels.com/photo/36169775/
          hardware	06-microchip-components.jpg	6755086	https://www.pexels.com/photo/6755086/
          hardware	07-electronic-chip-board.jpg	6754853	https://www.pexels.com/photo/6754853/
          hardware	08-computer-board-components.jpg	36169769	https://www.pexels.com/photo/36169769/
          hardware	09-gold-hardware-contacts.jpg	6704970	https://www.pexels.com/photo/6704970/
          hardware	10-electronic-board-detail.jpg	6755140	https://www.pexels.com/photo/6755140/
          EOF

      - name: Commit media library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'blackpine-media-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add media-library/blackpine-shortlist
          if git diff --cached --quiet; then
            echo 'No media changes to commit.'
            exit 0
          fi
          git commit -m 'assets: add curated Blackpine image shortlist'
          git push origin HEAD:main
