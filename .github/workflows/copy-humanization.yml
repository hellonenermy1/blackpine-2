name: Copy humanization pass

on:
  push:
    branches: [copy-humanization-pass]
    paths:
      - '.github/workflows/copy-humanization.yml'

permissions:
  contents: write

jobs:
  humanize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Humanize public-facing copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:120]}')
              p.write_text(text.replace(old, new, 1))

          replace('src/pages/contact-legal.mjs',
            '<section class="section editorial-split-section contact-editorial" aria-label="Canadian operating context"><div class="shell editorial-split editorial-split-reverse"><div class="editorial-split-copy"><span class="eyebrow">Canada-based practice</span><h2>Start with the situation, not the service name.</h2><p>The public contact route is intentionally simple: describe what changed, what is affected, and what outcome you need. The Toronto image provides geographic context only; it does not represent a Blackpine office location.</p></div><figure class="editorial-split-media"><img src="/assets/editorial/contact-canada-landscape.jpg"',
            '<section class="section editorial-split-section contact-editorial" aria-label="Contact Blackpine"><div class="shell editorial-split editorial-split-reverse"><div class="editorial-split-copy"><span class="eyebrow">Canada-based practice</span><h2>Start with the situation.</h2><p>Tell us what changed, what is affected, and what outcome you need. We will route the request to the right team.</p></div><figure class="editorial-split-media"><img src="/assets/editorial/contact-canada-landscape.jpg"')
          replace('src/pages/contact-legal.mjs',
            ' loading="lazy" decoding="async" fetchpriority="low"><figcaption>Toronto / geographic context — not a Blackpine office</figcaption></figure>',
            ' loading="lazy" decoding="async" fetchpriority="low"></figure>')

          replace('src/pages/company.mjs', ' aria-label="Company visual context"', ' aria-label="Company"')
          replace('src/pages/company.mjs', '<figcaption>Built environment / structure</figcaption>', '')
          replace('src/pages/company.mjs', '<figcaption>Canadian context / Toronto</figcaption>', '')
          replace('src/pages/company.mjs',
            "Michael Calloway is Blackpine's CEO and owner. Anthony Adinolfi is listed separately as Principal Security Consultant & Founder; those titles are preserved as distinct public facts rather than being turned into a company-history narrative that has not been established for publication.",
            "Michael Calloway leads Blackpine as CEO and owner. Anthony Adinolfi serves as Principal Security Consultant & Founder.")
          replace('src/pages/company.mjs',
            'As a brand image, black pine suggests restraint, resilience, and systems built for difficult conditions. The website uses that idea as a design standard: fewer unnecessary parts, clear lines of responsibility, and systems that are easier to inspect when pressure arrives. This is a brand interpretation, not a claim about the historical origin of the company name.',
            'The black pine reflects how Blackpine approaches security work: resilient, restrained, and built for difficult conditions. That means clear ownership, fewer unnecessary layers, and systems that remain understandable under pressure.')
          replace('src/pages/company.mjs',
            'The common denominator is not an industry label. It is dependence on systems where a small number of identities, vendors, applications, or administrative paths can affect a much larger part of the operation. The examples below describe environments Blackpine can support; they are not a public client list or a claim of sector-specific client history.',
            'Blackpine works best with organizations that depend on a small number of important identities, vendors, applications, or administrative systems. The examples below show the kinds of environments where our work is most relevant.')
          replace('src/pages/company.mjs',
            '<section class="section editorial-split-section careers-editorial" aria-label="Careers working context"><div class="shell editorial-split"><figure class="editorial-split-media"><img src="/assets/editorial/careers-engineering-landscape.jpg"',
            '<section class="section editorial-split-section careers-editorial" aria-label="Careers at Blackpine"><div class="shell editorial-split"><figure class="editorial-split-media"><img src="/assets/editorial/careers-engineering-landscape.jpg"')
          replace('src/pages/company.mjs',
            ' loading="lazy" decoding="async" fetchpriority="low"><figcaption>Engineering work / editorial context — not a staff photograph</figcaption></figure><div class="editorial-split-copy"><span class="eyebrow">Working style</span><h2>Careful work, explained clearly.</h2><p>Blackpine\'s hiring language emphasizes evidence, reasoning, ownership, and systems that remain understandable after the work is complete. The image is editorial context rather than a representation of Blackpine staff.</p></div>',
            ' loading="lazy" decoding="async" fetchpriority="low"></figure><div class="editorial-split-copy"><span class="eyebrow">Working style</span><h2>Careful work, explained clearly.</h2><p>We value clear reasoning, strong evidence, ownership, and work that leaves systems easier to understand and operate.</p></div>')
          replace('src/pages/company.mjs',
            '<div class="notice"><strong>Planned does not mean open.</strong><p>When a position opens, Blackpine will publish its scope, responsibilities, location or working model, requirements, hiring process, and application instructions. Until then, no JobPosting structured data is emitted for these roles.</p></div>',
            '<div class="notice"><strong>Hiring status</strong><p>Roles marked as planned are not accepting applications yet. Open positions will include the role scope, location or working model, requirements, hiring process, and application instructions.</p></div>')

          replace('src/pages/home.mjs',
            '<h1>Security engineering for systems that carry consequence.</h1><p class="lead">Blackpine is a ${companyFacts.teamSize}-person Canadian cybersecurity firm covering advisory, defensive engineering, incident response, security operations, risk, and technical research. Start with the situation; Blackpine can determine the specialist path internally.</p>',
            '<h1>Security engineering for systems that matter.</h1><p class="lead">Blackpine is a ${companyFacts.teamSize}-person Canadian cybersecurity firm covering advisory, defensive engineering, incident response, security operations, risk, and technical research. Tell us what is happening and we will connect you with the right specialist.</p>')
          replace('src/pages/home.mjs',
            '<p>One practice across advisory, engineering, incident response, SOC, and risk disciplines means a customer can describe the problem in ordinary language while Blackpine routes the work to the right function.</p>',
            '<p>Advisory, engineering, incident response, SOC, and risk teams work together, so clients can start with the problem instead of trying to choose the right service first.</p>')
          replace('src/pages/home.mjs',
            '<h2>Show the shape of the work without exposing the client.</h2><p>Engagement patterns are separated from approved client stories. Client names, quotes, logos, and outcomes only appear when attribution is permitted and the description does not reveal sensitive systems or evidence.</p>',
            '<h2>Representative engagement patterns.</h2><p>These examples show how common Blackpine engagements are structured. Client identities and sensitive details remain confidential unless publication is approved.</p>')
          replace('src/pages/home.mjs',
            '<h2>Engineering work should survive inspection.</h2><p>Blackpine Cipher is developed on a separate application surface with its own threat model, verification workflow, and technical documentation. The corporate site links to it without sharing application code or an assumed trust boundary.</p>',
            '<h2>Engineering work should stand up to scrutiny.</h2><p>Blackpine Cipher runs separately from the corporate site, with its own threat model, verification workflow, and technical documentation.</p>')
          replace('src/pages/home.mjs',
            '<span class="eyebrow">Trust</span><h2>Publish the boundary.</h2><p>Blackpine documents website security, data handling, responsible disclosure, and the separation between corporate, support, verification, and Cipher systems. Claims are kept narrower than the evidence supporting them.</p>',
            '<span class="eyebrow">Trust</span><h2>Clear security boundaries.</h2><p>Blackpine documents website security, data handling, responsible disclosure, and how the corporate, support, verification, and Cipher systems are separated.</p>')

          replace('src/pages/services.mjs',
            "lead: 'You do not need to know whether the right answer is DFIR, IAM, MDR, application security, or another specialist discipline. Start with the situation. Blackpine can triage the problem and route the work internally.'",
            "lead: 'Start with what is happening. Blackpine will identify the right mix of incident response, investigation, protection, monitoring, engineering, or advisory support.'")
          replace('src/pages/services.mjs',
            '<h2>Six ways to enter Blackpine.</h2><p>Choose the statement closest to the problem. The specialist service can be decided after the facts and objective are clear.</p>',
            '<h2>Choose the situation that fits best.</h2><p>Start with the closest match. We can narrow the technical scope once we understand the facts and the outcome you need.</p>')
          replace('src/pages/services.mjs',
            '<h2>For buyers who already know the technical scope.</h2><p>Existing specialist pages remain available for defined assessments, testing, forensics, monitoring, identity, cloud, application, readiness, compliance, and advisory requirements.</p>',
            '<h2>Already know what you need?</h2><p>Explore specialist services for assessments, testing, forensics, monitoring, identity, cloud, application security, readiness, compliance, and advisory work.</p>')
          replace('src/pages/services.mjs', 'Illustrative finding — not client data', 'Example finding')
          replace('src/pages/services.mjs',
            '<div class="notice"><strong>Service commitments belong in the written agreement.</strong><p>Response windows, coverage hours, supported products, monitoring responsibilities, escalation, access, data handling, and unused retainer capacity are not implied by the website.</p></div>',
            '<div class="notice"><strong>Service commitments are agreed in writing.</strong><p>Each engagement defines response windows, coverage hours, supported products, monitoring responsibilities, escalation, access, data handling, and retainer terms where applicable.</p></div>')

          replace('src/pages/labs-trust.mjs',
            "lead: 'Blackpine Labs is the project layer of the company: build something real, define the security model, expose the verification surface, and document where the system stops. Labs sits alongside the client practice but does not silently inherit the scope, data, or trust assumptions of a client engagement.'",
            "lead: 'Blackpine Labs is where we build and document security engineering projects. Each project has its own security model, verification process, documentation, and operating boundary.'")
          replace('src/pages/labs-trust.mjs',
            "lead: 'A separate Blackpine application for file encryption. The corporate site describes the project boundary; release-specific cryptographic claims belong to the current application documentation and verified implementation.'",
            "lead: 'Blackpine Cipher is a separate application for file encryption. Current cryptographic details, verification information, and release notes are maintained with the application documentation.'")
          replace('src/pages/labs-trust.mjs',
            '<p>The public project overview stays intentionally stable. The current threat model, test vectors, verification workflow, and release-specific cryptographic details belong with the project documentation so they can change with the implementation instead of drifting out of sync.</p>',
            '<p>The current threat model, test vectors, verification workflow, and release-specific cryptographic details are maintained with the project documentation so they stay aligned with the implementation.</p>')
          replace('src/pages/labs-trust.mjs',
            "title: 'Cipher security model — public boundary',\n    lead: 'This page defines which Cipher claims belong on the corporate site and which must come from the current project implementation and release documentation.'",
            'title: \'Cipher security model\',\n    lead: "An overview of Cipher\'s public security principles and where to find current implementation and release-specific details."')
          replace('src/pages/labs-trust.mjs',
            "lead: 'Public information about website security, client-data handling, responsible disclosure, and the boundaries between Blackpine corporate, support, verification, and Cipher systems. These pages describe controls and boundaries Blackpine can state directly; they are not substitutes for certifications, audits, or assurances that have not been independently established.'",
            "lead: 'Public information about website security, client-data handling, responsible disclosure, and how Blackpine separates its corporate, support, verification, and Cipher systems.'")
          replace('src/pages/labs-trust.mjs',
            '<div class="notice"><strong>Publication standard</strong><p>Certifications, audits, partnerships, insurance, customer marks, and similar trust claims are published only when they are current, verifiable, and permitted for public use.</p></div>',
            '<div class="notice"><strong>Verified information only</strong><p>Blackpine publishes certifications, audits, partnerships, insurance, customer marks, and similar trust information only when it is current and approved for public use.</p></div>')

          p = Path('scripts/check.mjs')
          text = p.read_text()
          text = text.replace("if (!careersHtml.includes('not a staff photograph')) errors.push('careers editorial image must retain its non-staff context caption');\n", '')
          text = text.replace("if (!contactHtml.includes('not a Blackpine office')) errors.push('contact editorial image must retain its office-location disclaimer');\n", '')
          marker = "const trustHtml = await fs.readFile(new URL('./trust/index.html', dist), 'utf8');\nif (trustHtml.includes('/assets/editorial/')) errors.push('Trust index should remain documentation-first without editorial photography');\n"
          addition = marker + "\nconst bannedPublicCopy = [\n  'not a Blackpine office',\n  'not a staff photograph',\n  'editorial context',\n  'no JobPosting structured data is emitted',\n  'does not silently inherit',\n  'rather than being turned into a company-history narrative',\n  'This is a brand interpretation, not a claim',\n  'geographic context only'\n];\nfor (const rel of ['./index.html','./services/index.html','./company/about/index.html','./company/careers/index.html','./company/who-we-work-with/index.html','./contact/index.html','./labs/index.html','./labs/cipher/index.html','./labs/cipher/security-model/index.html','./trust/index.html']) {\n  const html = await fs.readFile(new URL(rel, dist), 'utf8');\n  for (const phrase of bannedPublicCopy) {\n    if (html.includes(phrase)) errors.push(`${rel} contains internal-facing copy: ${phrase}`);\n  }\n}\n"
          if 'bannedPublicCopy' not in text:
              if marker not in text:
                  raise SystemExit('check marker missing')
              text = text.replace(marker, addition, 1)
          p.write_text(text)
          PY
      - name: Verify production build
        run: npm run verify
      - name: Commit copy cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'blackpine-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages scripts/check.mjs
          git commit -m 'copy: remove internal and AI-sounding public wording' || exit 0
          git push origin HEAD:copy-humanization-pass

# run-3
