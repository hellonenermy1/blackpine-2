name: Build Device Diagnostics Logger APK

on:
  push:
    branches:
      - device-diagnostics-logger
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        env:
          SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and audit v3.2 Phase 1 source
        run: |
          set -euo pipefail
          rm -rf build-src
          mkdir -p build-src
          cat device-diagnostics-logger/v32p1.source.00.b64 \
              device-diagnostics-logger/v32p1.source.01.b64 \
              device-diagnostics-logger/v32p1.source.02.b64 \
              device-diagnostics-logger/v32p1.source.03.b64 | base64 -d > build-src/source.tar.xz
          echo '03ba6a3f5c02171c818c20dbe929cab25c8fe8bf005684861f1bd5e053bf4551  build-src/source.tar.xz' | sha256sum -c -
          xz -t build-src/source.tar.xz
          tar -xJf build-src/source.tar.xz -C build-src

          APP=build-src/DeviceDiagnosticsLogger
          test -f "$APP/settings.gradle"
          grep -q "versionName '3.2.0-phase1'" "$APP/app/build.gradle"
          grep -q 'versionCode 320' "$APP/app/build.gradle"
          grep -q 'aidl true' "$APP/app/build.gradle"
          grep -q 'buildConfig true' "$APP/app/build.gradle"
          grep -q 'android.permission.WAKE_LOCK' "$APP/app/src/main/AndroidManifest.xml"
          grep -q 'android:name=".DiagnosticsApp"' "$APP/app/src/main/AndroidManifest.xml"
          grep -q 'rikka.shizuku.ShizukuProvider' "$APP/app/src/main/AndroidManifest.xml"
          grep -q 'class CrashReporter' "$APP/app/src/main/java/com/offlineperf/logger/CrashReporter.java"
          grep -q 'START_STICKY' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"
          grep -q 'startLoggingSafely' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"
          grep -q 'watchdog' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"
          grep -q 'overnight_reliability' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"
          grep -q 'isSessionRunning' "$APP/app/src/main/java/com/offlineperf/logger/DiagnosticsDb.java"
          grep -q 'quick_check' "$APP/app/src/main/java/com/offlineperf/logger/DiagnosticsDb.java"
          grep -q 'BOOT_COMPLETED' "$APP/app/src/main/java/com/offlineperf/logger/BootReceiver.java"
          grep -q 'ACTION_RECONFIGURE' "$APP/app/src/main/java/com/offlineperf/logger/MainActivity.java"
          grep -q 'flightTick' "$APP/app/src/main/java/com/offlineperf/logger/Sampler.java"
          if grep -R -q 'android.permission.INTERNET' "$APP/app/src/main/AndroidManifest.xml"; then
            echo 'ERROR: logger must remain offline; INTERNET permission found'
            exit 1
          fi
          grep -q '^android.useAndroidX=true$' "$APP/gradle.properties"

      - name: Build debug APK
        working-directory: build-src/DeviceDiagnosticsLogger
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        run: |
          set -euo pipefail
          APK=build-src/DeviceDiagnosticsLogger/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceDiagnosticsLogger-v3.2-phase1-reliability-apk
          path: build-src/DeviceDiagnosticsLogger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
