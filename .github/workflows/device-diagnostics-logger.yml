name: Build Device Diagnostics Logger APK

on:
  push:
    branches:
      - device-diagnostics-logger-phase2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        env:
          SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Phase 1 and apply Phase 2 upgrade
        run: |
          set -euo pipefail
          rm -rf build-src
          mkdir -p build-src
          cat device-diagnostics-logger/v32p1r2.source.00.b64 \
              device-diagnostics-logger/v32p1r2.source.01.b64 \
              device-diagnostics-logger/v32p1r2.source.02.b64 \
              device-diagnostics-logger/v32p1r2.source.03.b64 | base64 -d > build-src/source.tar.xz
          echo 'c43c6d5dc2e805526dbd9b5a8445f944a9aea6cf9882cf2c5ae6a46789e31f4d  build-src/source.tar.xz' | sha256sum -c -
          xz -t build-src/source.tar.xz
          tar -xJf build-src/source.tar.xz -C build-src
          cp device-diagnostics-logger/apply-v32p2.py build-src/apply-v32p2.py
          (cd build-src && python3 apply-v32p2.py)

          APP=build-src
          test -f "$APP/settings.gradle"
          grep -q "versionName '3.2.0-phase2'" "$APP/app/build.gradle"
          grep -q 'versionCode 321' "$APP/app/build.gradle"
          grep -q 'START_STICKY' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"
          grep -q '700,TimeUnit.MILLISECONDS' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"
          grep -q 'periodic_2.8s' "$APP/app/src/main/java/com/offlineperf/logger/Sampler.java"
          grep -q 'periodic_7s_screen_off' "$APP/app/src/main/java/com/offlineperf/logger/Sampler.java"
          grep -q 'BATTERY_PROPERTY_CURRENT_NOW' "$APP/app/src/main/java/com/offlineperf/logger/Sampler.java"
          grep -q 'BATTERY_PROPERTY_CURRENT_AVERAGE' "$APP/app/src/main/java/com/offlineperf/logger/Sampler.java"
          grep -q 'BATTERY_PROPERTY_CHARGE_COUNTER' "$APP/app/src/main/java/com/offlineperf/logger/Sampler.java"
          grep -q 'getThermalHeadroom(0)' "$APP/app/src/main/java/com/offlineperf/logger/Sampler.java"
          grep -q 'cpuFreqsKhz' "$APP/app/src/main/java/com/offlineperf/logger/Sampler.java"
          grep -q 'scheduled_lateness_ms' "$APP/app/src/main/java/com/offlineperf/logger/DiagnosticsDb.java"
          grep -q 'battery_current_ua' "$APP/app/src/main/java/com/offlineperf/logger/DiagnosticsDb.java"
          grep -q 'runPragma' "$APP/app/src/main/java/com/offlineperf/logger/DiagnosticsDb.java"
          if grep -q 'execSQL("PRAGMA' "$APP/app/src/main/java/com/offlineperf/logger/DiagnosticsDb.java"; then
            echo 'ERROR: unsafe execSQL PRAGMA remains'
            exit 1
          fi
          grep -q 'device-diagnostics-forensics-v3.2-phase2' "$APP/app/src/main/java/com/offlineperf/logger/ExportManager.java"
          grep -q 'reliability_state.json' "$APP/app/src/main/java/com/offlineperf/logger/ExportManager.java"
          grep -q 'crash_report.json' "$APP/app/src/main/java/com/offlineperf/logger/ExportManager.java"
          if grep -R -q 'android.permission.INTERNET' "$APP/app/src/main/AndroidManifest.xml"; then
            echo 'ERROR: logger must remain offline; INTERNET permission found'
            exit 1
          fi

      - name: Build debug APK
        working-directory: build-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        run: |
          set -euo pipefail
          APK=build-src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceDiagnosticsLogger-v3.2-phase2-precision-apk
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
