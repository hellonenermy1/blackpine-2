name: Build Device Diagnostics Logger APK

on:
  push:
    branches:
      - device-diagnostics-logger
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        env:
          SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and audit v3.1 source
        run: |
          set -euo pipefail
          rm -rf build-src
          mkdir -p build-src
          cat device-diagnostics-logger/v31.source.01.b64 \
              device-diagnostics-logger/v31.source.02.b64 \
              device-diagnostics-logger/v31.source.03.b64 | base64 -d > build-src/source.tar.xz
          echo 'a49655c19eb6835459b7340cdb7b03dc066e7d57ec39e9bb9b30040d64eb7cae  build-src/source.tar.xz' | sha256sum -c -
          xz -t build-src/source.tar.xz
          tar -xJf build-src/source.tar.xz -C build-src

          APP=build-src/DeviceDiagnosticsLogger
          test -f "$APP/settings.gradle"
          grep -q "versionName '3.1.0'" "$APP/app/build.gradle"
          grep -q 'versionCode 310' "$APP/app/build.gradle"
          grep -q 'aidl true' "$APP/app/build.gradle"
          grep -q 'buildConfig true' "$APP/app/build.gradle"
          grep -q 'rikka.shizuku.ShizukuProvider' "$APP/app/src/main/AndroidManifest.xml"
          grep -q 'flightTick' "$APP/app/src/main/java/com/offlineperf/logger/Sampler.java"
          grep -q 'scheduleAtFixedRate(()->sampler.flightTick(),250,250' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"
          grep -q 'periodic_15s_screen_off' "$APP/app/src/main/java/com/offlineperf/logger/Sampler.java"
          grep -q 'forensic_points' "$APP/app/src/main/java/com/offlineperf/logger/DiagnosticsDb.java"
          grep -q 'wal_checkpoint' "$APP/app/src/main/java/com/offlineperf/logger/DiagnosticsDb.java"
          grep -q 'diagnostic_manifest.json' "$APP/app/src/main/java/com/offlineperf/logger/ExportManager.java"
          grep -q 'device-diagnostics-forensics-v3.1' "$APP/app/src/main/java/com/offlineperf/logger/ExportManager.java"
          grep -q 'PROCESS_ROWS_PER_ENTRY = 200_000' "$APP/app/src/main/java/com/offlineperf/logger/ExportManager.java"
          grep -q 'new ZipFile' "$APP/app/src/main/java/com/offlineperf/logger/ExportManager.java"
          if grep -R -q 'android.permission.INTERNET' "$APP/app/src/main/AndroidManifest.xml"; then
            echo 'ERROR: logger must remain offline; INTERNET permission found'
            exit 1
          fi
          grep -q '^android.useAndroidX=true$' "$APP/gradle.properties"

      - name: Build debug APK
        working-directory: build-src/DeviceDiagnosticsLogger
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        run: |
          set -euo pipefail
          APK=build-src/DeviceDiagnosticsLogger/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceDiagnosticsLogger-v3.1-reliability-fix-apk
          path: build-src/DeviceDiagnosticsLogger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
