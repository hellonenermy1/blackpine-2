name: Build Device Diagnostics Logger APK

on:
  push:
    branches:
      - device-diagnostics-logger
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract logger source
        run: |
          mkdir -p build-src
          unzip -q device-diagnostics-logger/DeviceDiagnosticsLogger-v1.3-phone-build.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/DeviceDiagnosticsLogger
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceDiagnosticsLogger-v1.3-debug-apk
          path: build-src/DeviceDiagnosticsLogger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
