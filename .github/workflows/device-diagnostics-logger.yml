name: Build Device Diagnostics Logger APK

on:
  push:
    branches:
      - device-diagnostics-logger-phase2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        env:
          SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and source-audit Phase 3
        run: |
          set -euo pipefail
          rm -rf build-src
          mkdir -p build-src
          cat device-diagnostics-logger/v32p1r2.source.00.b64 \
              device-diagnostics-logger/v32p1r2.source.01.b64 \
              device-diagnostics-logger/v32p1r2.source.02.b64 \
              device-diagnostics-logger/v32p1r2.source.03.b64 | base64 -d > build-src/source.tar.xz
          echo 'c43c6d5dc2e805526dbd9b5a8445f944a9aea6cf9882cf2c5ae6a46789e31f4d  build-src/source.tar.xz' | sha256sum -c -
          xz -t build-src/source.tar.xz
          tar -xJf build-src/source.tar.xz -C build-src
          rm build-src/source.tar.xz
          cd build-src
          python ../device-diagnostics-logger/apply-v32p2.py
          python ../device-diagnostics-logger/apply-v33p3.py
          python ../device-diagnostics-logger/apply-v33p3-auditfix.py
          cd ..
          APP=build-src
          grep -q "versionName '3.3.0-phase3'" "$APP/app/build.gradle"
          grep -q 'versionCode 330' "$APP/app/build.gradle"
          grep -q 'class LiveConsole' "$APP/app/src/main/java/com/offlineperf/logger/LiveConsole.java"
          grep -q 'class LiveState' "$APP/app/src/main/java/com/offlineperf/logger/LiveState.java"
          grep -q 'lastNotificationUpdate>=2000' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"
          grep -q 'logger_console.txt' "$APP/app/src/main/java/com/offlineperf/logger/ExportManager.java"
          grep -q 'Device Diagnostics Logger v3.3 Phase 3 export' "$APP/app/src/main/java/com/offlineperf/logger/ExportManager.java"
          grep -q 'device-diagnostics-forensics-v3.3-phase3' "$APP/app/src/main/java/com/offlineperf/logger/ExportManager.java"
          grep -q 'Live console' "$APP/app/src/main/java/com/offlineperf/logger/MainActivity.java"
          if grep -R -q 'execSQL("PRAGMA' "$APP/app/src/main/java"; then echo 'ERROR query PRAGMA uses execSQL'; exit 1; fi
          if grep -R -q 'android.permission.INTERNET' "$APP/app/src/main/AndroidManifest.xml"; then echo 'ERROR INTERNET source permission'; exit 1; fi
          if grep -R -q 'v3.2 Phase 1 export' "$APP/app/src/main/java"; then echo 'ERROR stale release metadata'; exit 1; fi
          grep -q 'android.permission.WAKE_LOCK' "$APP/app/src/main/AndroidManifest.xml"
          grep -q 'rikka.shizuku.ShizukuProvider' "$APP/app/src/main/AndroidManifest.xml"

      - name: Android Lint
        working-directory: build-src
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Build debug APK
        working-directory: build-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Compiled APK audit
        env:
          AAPT: /usr/local/lib/android/sdk/build-tools/35.0.0/aapt
          APKSIGNER: /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner
        run: |
          set -euo pipefail
          APK=build-src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > apk-files.txt
          "$AAPT" dump permissions "$APK" > apk-permissions.txt
          "$AAPT" dump badging "$APK" > apk-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > apk-manifest-tree.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > apk-signing.txt
          grep -q "package: name='com.offlineperf.logger'" apk-badging.txt
          grep -q "versionName='3.3.0-phase3'" apk-badging.txt
          if grep -q 'android.permission.INTERNET' apk-permissions.txt; then echo 'ERROR INTERNET in compiled APK'; exit 1; fi
          grep -q 'android.permission.FOREGROUND_SERVICE' apk-permissions.txt
          grep -q 'android.permission.WAKE_LOCK' apk-permissions.txt
          unzip -p "$APK" classes3.dex | strings > dex3-strings.txt || true
          grep -q 'LiveConsole' dex3-strings.txt
          grep -q 'LiveState' dex3-strings.txt
          grep -q 'device-diagnostics-forensics-v3.3-phase3' dex3-strings.txt
          if grep -q 'v3.2 Phase 1 export' dex3-strings.txt; then echo 'ERROR stale metadata in compiled DEX'; exit 1; fi
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload final APK and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: DeviceDiagnosticsLogger-v3.3-phase3-audited-final
          path: |
            build-src/app/build/outputs/apk/debug/app-debug.apk
            build-src/app/build/reports/lint-results-debug.html
            build-src/app/build/reports/lint-results-debug.txt
            apk-files.txt
            apk-permissions.txt
            apk-badging.txt
            apk-manifest-tree.txt
            apk-signing.txt
            apk-sha256.txt
          if-no-files-found: error
