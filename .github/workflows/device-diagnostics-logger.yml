name: Build Device Diagnostics Logger APK

on:
  push:
    branches:
      - device-diagnostics-logger
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        env:
          SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and validate v2 source
        run: |
          rm -rf build-src
          mkdir -p build-src
          cat device-diagnostics-logger/source.part1.b64 device-diagnostics-logger/source.part2.b64 | base64 -d > build-src/source.tar.xz
          xz -t build-src/source.tar.xz
          tar -xJf build-src/source.tar.xz -C build-src
          test -f build-src/DeviceDiagnosticsLogger/settings.gradle
          grep -q "versionName '2.0.0'" build-src/DeviceDiagnosticsLogger/app/build.gradle
          grep -q 'adaptive 1-second' build-src/DeviceDiagnosticsLogger/app/src/main/java/com/offlineperf/logger/MainActivity.java
          grep -q 'getCompactHardware' build-src/DeviceDiagnosticsLogger/app/src/main/aidl/com/offlineperf/logger/IProcUserService.aidl
          sed -i 's/^android.useAndroidX=false$/android.useAndroidX=true/' build-src/DeviceDiagnosticsLogger/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('build-src/DeviceDiagnosticsLogger/app/build.gradle')
          s = gradle.read_text()
          if 'buildFeatures {' not in s:
              s = s.replace('android {\n', 'android {\n    buildFeatures {\n        aidl true\n        buildConfig true\n    }\n\n', 1)
          gradle.write_text(s)

          manifest = Path('build-src/DeviceDiagnosticsLogger/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'rikka.shizuku.ShizukuProvider' not in m:
              provider = '''        <provider\n            android:name="rikka.shizuku.ShizukuProvider"\n            android:authorities="${applicationId}.shizuku"\n            android:enabled="true"\n            android:exported="true"\n            android:multiprocess="false"\n            android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />\n\n'''
              m = m.replace('        <activity\n            android:name=".MainActivity"', provider + '        <activity\n            android:name=".MainActivity"', 1)
          manifest.write_text(m)
          PY
          grep -q '^android.useAndroidX=true$' build-src/DeviceDiagnosticsLogger/gradle.properties
          grep -q 'aidl true' build-src/DeviceDiagnosticsLogger/app/build.gradle
          grep -q 'buildConfig true' build-src/DeviceDiagnosticsLogger/app/build.gradle
          grep -q 'rikka.shizuku.ShizukuProvider' build-src/DeviceDiagnosticsLogger/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: build-src/DeviceDiagnosticsLogger
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceDiagnosticsLogger-v2.0-adaptive-1s-apk
          path: build-src/DeviceDiagnosticsLogger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
