name: Build Device Diagnostics Logger APK

on:
  push:
    branches:
      - device-diagnostics-logger
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        env:
          SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct logger source
        run: |
          rm -rf build-src
          mkdir -p build-src
          cat device-diagnostics-logger/source.part1.b64 device-diagnostics-logger/source.part2.b64 | base64 -d > build-src/source.tar.xz
          tar -xJf build-src/source.tar.xz -C build-src
          test -f build-src/DeviceDiagnosticsLogger/settings.gradle

      - name: Build debug APK
        working-directory: build-src/DeviceDiagnosticsLogger
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceDiagnosticsLogger-v1.3-debug-apk
          path: build-src/DeviceDiagnosticsLogger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
