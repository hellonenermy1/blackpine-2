name: Build Device Diagnostics Logger APK

on:
  push:
    branches:
      - device-diagnostics-logger-phase3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        env:
          SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Phase 2 and apply Phase 3 patch
        run: |
          set -euo pipefail
          rm -rf build-src
          mkdir -p build-src
          cat device-diagnostics-logger/v32p1r2.source.00.b64 \
              device-diagnostics-logger/v32p1r2.source.01.b64 \
              device-diagnostics-logger/v32p1r2.source.02.b64 \
              device-diagnostics-logger/v32p1r2.source.03.b64 | base64 -d > build-src/source.tar.xz
          echo 'c43c6d5dc2e805526dbd9b5a8445f944a9aea6cf9882cf2c5ae6a46789e31f4d  build-src/source.tar.xz' | sha256sum -c -
          xz -t build-src/source.tar.xz
          tar -xJf build-src/source.tar.xz -C build-src
          cp device-diagnostics-logger/apply-v32p2.py build-src/apply-v32p2.py
          (cd build-src && python3 apply-v32p2.py)
          base64 -d device-diagnostics-logger/phase3.patch.xz.b64 | xz -d > build-src/phase3.patch
          patch -d build-src -p1 < build-src/phase3.patch

          APP=build-src
          test -f "$APP/settings.gradle"
          grep -q "versionName '3.2.0-phase3'" "$APP/app/build.gradle"
          grep -q 'versionCode 322' "$APP/app/build.gradle"
          grep -q 'class ConsoleBus' "$APP/app/src/main/java/com/offlineperf/logger/ConsoleBus.java"
          grep -q 'MAX=1200' "$APP/app/src/main/java/com/offlineperf/logger/ConsoleBus.java"
          grep -q 'class TelemetryState' "$APP/app/src/main/java/com/offlineperf/logger/TelemetryState.java"
          grep -q 'coreNextDue+=700' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"
          grep -q 'flightNextDue+=250' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"
          if grep -q 'scheduleAtFixedRate' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"; then
            echo 'ERROR: fixed-rate scheduler remains; may burst after cached/Doze state'
            exit 1
          fi
          grep -q 'acquire(12L\*60\*60\*1000)' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"
          grep -q 'lastNotificationUpdate>=2000' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"
          grep -q 'ConsoleBus.log("CORE"' "$APP/app/src/main/java/com/offlineperf/logger/LoggerService.java"
          grep -q 'TelemetryState.publish' "$APP/app/src/main/java/com/offlineperf/logger/Sampler.java"
          grep -q 'capability_report.json' "$APP/app/src/main/java/com/offlineperf/logger/ExportManager.java"
          grep -q 'logger_console.txt' "$APP/app/src/main/java/com/offlineperf/logger/ExportManager.java"
          grep -q 'device-diagnostics-forensics-v3.2-phase3' "$APP/app/src/main/java/com/offlineperf/logger/ExportManager.java"
          grep -q 'Open live console' "$APP/app/src/main/java/com/offlineperf/logger/MainActivity.java"
          if grep -q 'execSQL("PRAGMA' "$APP/app/src/main/java/com/offlineperf/logger/DiagnosticsDb.java"; then
            echo 'ERROR: unsafe execSQL PRAGMA remains'
            exit 1
          fi
          if grep -R -q 'android.permission.INTERNET' "$APP/app/src/main/AndroidManifest.xml"; then
            echo 'ERROR: logger must remain offline; INTERNET permission found'
            exit 1
          fi

      - name: Android lint audit
        working-directory: build-src
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Build debug APK
        working-directory: build-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK-level Android audit
        run: |
          set -euo pipefail
          APK=build-src/app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          echo 'APK exists: PASS'
          unzip -t "$APK" >/dev/null
          echo 'ZIP integrity: PASS'
          "$TOOLS/zipalign" -c -v 4 "$APK" > build-src/zipalign-audit.txt
          echo 'ZIP alignment: PASS'
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > build-src/signature-audit.txt
          echo 'Signature verification: PASS'
          "$TOOLS/aapt2" dump badging "$APK" > build-src/apk-badging.txt
          "$TOOLS/aapt2" dump permissions "$APK" > build-src/apk-permissions.txt
          "$TOOLS/aapt2" dump xmltree "$APK" --file AndroidManifest.xml > build-src/apk-manifest-tree.txt
          grep -q "package: name='com.offlineperf.logger'" build-src/apk-badging.txt
          grep -q "targetSdkVersion:'34'" build-src/apk-badging.txt
          grep -q "versionName='3.2.0-phase3'" build-src/apk-badging.txt
          echo 'Package/version/target SDK: PASS'
          if grep -q 'android.permission.INTERNET' build-src/apk-permissions.txt; then
            echo 'ERROR: compiled APK unexpectedly requests INTERNET'
            exit 1
          fi
          grep -q 'android.permission.FOREGROUND_SERVICE' build-src/apk-permissions.txt
          grep -q 'android.permission.WAKE_LOCK' build-src/apk-permissions.txt
          echo 'Compiled permissions: PASS'
          grep -q 'com.offlineperf.logger.LoggerService' build-src/apk-manifest-tree.txt
          grep -q 'com.offlineperf.logger.BootReceiver' build-src/apk-manifest-tree.txt
          echo 'Expected manifest components: PASS'
          rm -rf build-src/dex-audit
          mkdir -p build-src/dex-audit
          (cd build-src/dex-audit && unzip -q ../../build-src/app/build/outputs/apk/debug/app-debug.apk 'classes*.dex')
          grep -aR -q 'ConsoleBus' build-src/dex-audit
          grep -aR -q 'TelemetryState' build-src/dex-audit
          echo 'Console/telemetry DEX classes: PASS'
          sha256sum "$APK" | tee build-src/apk-sha256.txt
          {
            echo 'PHASE 3 APK AUDIT PASS'
            echo 'ZIP integrity: PASS'
            echo 'ZIP alignment: PASS'
            echo 'Signature verification: PASS'
            echo 'Package/version/target SDK: PASS'
            echo 'No INTERNET permission: PASS'
            echo 'Expected service/receiver: PASS'
            echo 'Console/telemetry DEX classes: PASS'
          } > build-src/APK_AUDIT_SUMMARY.txt

      - name: Upload APK and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: DeviceDiagnosticsLogger-v3.2-phase3-audited-apk
          path: |
            build-src/app/build/outputs/apk/debug/app-debug.apk
            build-src/APK_AUDIT_SUMMARY.txt
            build-src/apk-badging.txt
            build-src/apk-permissions.txt
            build-src/apk-manifest-tree.txt
            build-src/signature-audit.txt
            build-src/zipalign-audit.txt
            build-src/apk-sha256.txt
            build-src/app/build/reports/lint-results-debug.html
            build-src/app/build/reports/lint-results-debug.xml
          if-no-files-found: error
