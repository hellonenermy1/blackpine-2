name: Monitor production integrity

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-integrity-monitor
  cancel-in-progress: false

jobs:
  production-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build independent comparison baseline
        run: npm run build && npm run check:integrity
      - name: Compare public content and assets with baseline
        run: npm run check:defacement
      - name: Retain monitoring result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-integrity-result
          path: integrity-artifacts/
          if-no-files-found: warn
          retention-days: 14
